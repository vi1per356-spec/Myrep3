name: Build APK

# Builds the installable Android APK natively on a GitHub runner
# (open internet) and publishes it as an artifact + a GitHub Release.

on:
  push:
    branches:
      - claude/ukraine-threat-tracker-client-77V9A
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            cmake ccache libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel
          pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Build debug APK
        working-directory: client
        run: yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ukraine-threat-tracker-apk
          path: client/bin/*.apk
          if-no-files-found: error

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Ukraine Threat Tracker APK (latest)
          files: client/bin/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
